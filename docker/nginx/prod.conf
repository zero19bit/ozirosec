upstream hackpath_php {
    server php:9000;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 10m;
    server_tokens off;

    location = /health/live {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /health/ready {
        root /var/www/backend/public;
        include fastcgi_params;
        fastcgi_pass hackpath_php;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param REQUEST_URI /health/ready;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ ^/(api|sanctum)(/|$) {
        root /var/www/backend/public;
        include fastcgi_params;
        fastcgi_pass hackpath_php;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
