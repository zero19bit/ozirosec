name: hackpath

services:
  php:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    env_file:
      - docker/env/backend.dev.example
    environment:
      # Shared only with the internal n8n service to authenticate signed ingestion requests.
      WRITEUP_INGEST_HMAC_SECRET: ${WRITEUP_INGEST_HMAC_SECRET:?Set WRITEUP_INGEST_HMAC_SECRET in an untracked .env file}
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan --version >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - public

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_SANCTUM_CSRF_URL: http://localhost:8000/sanctum/csrf-cookie
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
    networks:
      - public

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hackpath
      POSTGRES_USER: hackpath
      POSTGRES_PASSWORD: hackpath_dev_password
      POSTGRES_N8N_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_N8N_USER: ${N8N_DB_USER:-n8n_user}
      POSTGRES_N8N_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in an untracked .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackpath -d hackpath"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  n8n:
    image: n8nio/n8n:1.118.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      TZ: ${TZ:-Asia/Tehran}
      GENERIC_TIMEZONE: ${TZ:-Asia/Tehran}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in an untracked .env file}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n_user}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in an untracked .env file}
      EXECUTIONS_DATA_PRUNE: ${N8N_EXECUTIONS_DATA_PRUNE:-true}
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_DATA_MAX_AGE:-336}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Required by the signed-ingestion Code nodes. Keep this allowlist narrow.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # n8n reaches Laravel through Nginx on Docker's private network, not via localhost.
      HACKPATH_INTERNAL_API_URL: ${HACKPATH_INTERNAL_API_URL:-http://nginx}
      N8N_CONCURRENCY_PRODUCTION_LIMIT: ${N8N_CONCURRENCY_PRODUCTION_LIMIT:-5}
      WRITEUP_INGEST_HMAC_SECRET: ${WRITEUP_INGEST_HMAC_SECRET:?Set WRITEUP_INGEST_HMAC_SECRET in an untracked .env file}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 768m
    cpus: 0.75
    networks:
      - internal
      - public

volumes:
  postgres_data:
  backend_vendor:
  backend_storage:
  frontend_node_modules:
  n8n_data:

networks:
  internal:
    internal: true
  public:
